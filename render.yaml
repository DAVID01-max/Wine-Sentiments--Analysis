services:
  - type: web
    name: wine-review-api
    runtime: python
    plan: free
    # Trains only if artifacts/best_model.joblib is not already committed.
    buildCommand: pip install -r requirements.txt && python train.py --if-missing
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
